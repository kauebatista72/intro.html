<!-- DOCTYPE - serve para indicar para os navegadores a versão e qual o padrão de HTML está sendo usado -->
<!DOCTYPE html>

<!-- HTML - Elemento raiz. Tudo que pertencem ao documento HTML fica dentro dele -->

<!-- LANG/language(idioma) = Atributo responsável pela linguagem do conteúdo do site. Álem disso, tem um impacto muito grande na acessibilidade e SEO. -->
<html lang="pt-br">


<head>

    <!-- Charset = essa configuração serve para indicar ao navegador qual o padrão/codificação de caracteres usar - Isso permite, utilizar palavras com acentos, caracteres especiais e emojis. -->
    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- tittle/titulo = Representa o título que aparece na aba do navegador para o usuário. -->
    <title>labubu</title>
</head>

<!-- body = conteúdo visivel que o usuario consome, como por exemplo titulos, formularios e etc. -->
<body>
    Olá mundo. Este é meu primeiro programa em html.
</body>

</html>
