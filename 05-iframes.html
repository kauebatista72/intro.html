<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre elemento iframe. Inlane Frame para embutir outros sites">
    <title>Sobre frames | HTML </title>
</head>
<body>
    <h1>Iframe </h1>

    <p>O inline frame é um elemento que nos permite embutir outro documento do conteudo externo dentro da nossa página. É bastante usado para youtube, google maps, formularios e etc. </p>
    
    <p>Exemplo básico de iframe </p>
    <iframe src="04-imagens.html" frameborder="0"></iframe>

    <hr> 
    <h3>Carregando o youtube</h3>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/HsTRLC8Z7tI?si=06URWtqyDaqLTGAH" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h3> Carregando mapas</h3>

    <iframe src="https://www.google.com/maps/@-23.6007991,-46.4296952,15z?entry=ttu&g_ep=EgoyMDI2MDkyMC4wIKXMDSoASAFQAw%3D%3D" frameborder="0"></iframe>

</body>

</html>
